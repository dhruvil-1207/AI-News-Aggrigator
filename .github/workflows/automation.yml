name: Daily AI Newsletter Dispatch

on:
  schedule:
    # This runs at 01:30 UTC (07:00 AM IST) every single day
    - cron: '27 4 * * *'
  workflow_dispatch: # This adds a "Play" button so we can test it manually!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute AI Summarizer & Mailer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python ai_worker.py
          python email_worker.py